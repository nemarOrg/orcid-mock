name: Smoke the binaries

# Runs the compiled binaries, built once on Linux and downloaded here, on a runner of each kind,
# so that what is released has actually started on those platforms. Called by ci.yml (when
# packaging changes) and by release.yml (always, before anything is published).
on:
  workflow_call:
    inputs:
      version:
        description: The version every binary must report, from package.json.
        type: string
        required: true
      artifact:
        description: Name of the artifact that holds dist/orcid-mock-* and dist/SHA256SUMS.
        type: string
        default: binaries

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.file }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            file: orcid-mock-linux-x64
          - os: ubuntu-24.04-arm
            file: orcid-mock-linux-arm64
          - os: macos-latest
            file: orcid-mock-darwin-arm64
          - os: windows-latest
            file: orcid-mock-windows-x64.exe
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: dist
      - name: Verify, then run the binary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          cd dist
          # The artifact transfer must not have changed the file.
          if command -v sha256sum >/dev/null; then
            grep " ${FILE}\$" SHA256SUMS | sha256sum --check -
          else
            grep " ${FILE}\$" SHA256SUMS | shasum -a 256 --check -
          fi
          chmod +x "${FILE}"
          # Windows prints a carriage return, which command substitution does not strip.
          actual="$("./${FILE}" --version | tr -d '\r')"
          test "${actual}" = "${VERSION}" || { echo "reports ${actual}, expected ${VERSION}"; exit 1; }
          id="$("./${FILE}" id -n 1 | tr -d '\r')"
          echo "${id}"
          [[ "${id}" =~ ^0009-9[0-9]{3}-[0-9]{4}-[0-9]{3}[0-9X]$ ]]
