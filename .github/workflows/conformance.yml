name: Conformance

# The suite in conformance/ run against ORCID's sandbox, to prove that what orcid-mock does is what
# ORCID does, and a smoke test of the published image as a services: container. Neither runs on a
# push or a pull request (the e2e job in ci.yml runs the same suite against the mock on every one).
on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run by hand; the weekly schedule runs only the sandbox job.
        type: choice
        options:
          - sandbox
          - services-smoke
          - both
        default: sandbox
      image:
        description: >-
          Image for the services-smoke job, with its tag. It can pass only against a published image
          whose package is public.
        default: ghcr.io/nemarorg/orcid-mock:1
  schedule:
    # Mondays, early morning UTC: a sandbox that changes is found within a week.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sandbox:
    if: github.event_name == 'schedule' || inputs.job != 'services-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The sandbox client's secrets live in this environment, which the owner restricts to main
    # (RELEASING.md, owner checklist), so a branch cannot read them. Repository secrets of the same
    # names work until it exists.
    environment: conformance
    permissions:
      contents: read
    steps:
      # The secrets reach this step and the test step only. A job that cannot run says so in the
      # log and the job summary, and succeeds: a warning is a visible skip, a red job would cry
      # wolf in every repository that has not registered a sandbox client.
      - name: Check that the sandbox client is configured
        id: config
        env:
          CLIENT_ID: ${{ secrets.ORCID_SANDBOX_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ORCID_SANDBOX_CLIENT_SECRET }}
          PUBLIC_ID: ${{ vars.ORCID_SANDBOX_PUBLIC_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLIENT_ID}" ] || missing+=("secret ORCID_SANDBOX_CLIENT_ID")
          [ -n "${CLIENT_SECRET}" ] || missing+=("secret ORCID_SANDBOX_CLIENT_SECRET")
          [ -n "${PUBLIC_ID}" ] || missing+=("variable ORCID_SANDBOX_PUBLIC_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf -v list '%s, ' "${missing[@]}"
            list="${list%, }"
            echo "::warning title=Sandbox conformance skipped::Not run. Missing: ${list}. See the owner checklist in RELEASING.md."
            {
              echo "### Sandbox conformance skipped"
              echo
              echo "Not run. Missing: ${list}."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.config.outputs.configured == 'true'
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --production
        if: steps.config.outputs.configured == 'true'
      - name: Run the conformance suite against the sandbox
        if: steps.config.outputs.configured == 'true'
        env:
          CONFORMANCE_TARGET: sandbox
          ORCID_API_BASE: https://sandbox.orcid.org
          ORCID_PUB_API_BASE: https://pub.sandbox.orcid.org
          ORCID_CLIENT_ID: ${{ secrets.ORCID_SANDBOX_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_SANDBOX_CLIENT_SECRET }}
          ORCID_PUBLIC_ID: ${{ vars.ORCID_SANDBOX_PUBLIC_ID }}
        run: |
          set -euo pipefail
          bun run conformance 2>&1 | tee conformance.log
      # What the run checked, not only that it passed: the sandbox's record may hold few items, and
      # the sandbox run does not require any.
      - name: Summarize the items checked
        if: always() && steps.config.outputs.configured == 'true'
        run: |
          {
            echo "### Items checked on the sandbox"
            echo
            echo '```'
            grep -E '^[AB][0-9] .* checked$' conformance.log || echo "(no read finished)"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # Proves on a real runner that the image carries a HEALTHCHECK the runner accepts: with no
  # `options: --health-cmd` (none could run, since the image has no shell), the service container
  # reports healthy by its own check, and the step after it finds the admin API answering at once.
  # It can pass only once the image is published and its package is public.
  services-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.job != 'sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      orcid:
        # Mutable on purpose: the input names the published image or a candidate tag to smoke-test by
        # hand, and this job holds no secrets.
        image: ${{ inputs.image }} # zizmor: ignore[unpinned-images]
        ports:
          - 9700:9700
        env:
          PUBLIC_BASE_URL: http://localhost:9700
    steps:
      - name: The service container is healthy by its own HEALTHCHECK
        run: |
          set -euo pipefail
          docker ps --format 'table {{.Image}}\t{{.Status}}'
          container="$(docker ps --quiet --filter publish=9700)"
          test -n "${container}"
          status="$(docker inspect --format '{{.State.Health.Status}}' "${container}")"
          echo "health status: ${status}"
          test "${status}" = healthy
      - name: The step after the service reaches the admin API, with no retry
        run: |
          set -euo pipefail
          # A single attempt: a retry loop here would hide a runner that did not wait for health.
          curl --fail --silent --show-error --max-time 5 http://localhost:9700/__admin/health \
            | jq -e '.status == "ok"'
