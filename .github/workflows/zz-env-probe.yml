name: Environment probe (temporary)
on:
  push:
    branches: [feature/issue-8-phase5-packaging]
permissions:
  contents: read
jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      dry: ${{ steps.s.outputs.dry }}
    steps:
      - id: s
        run: echo "dry=true" >> "${GITHUB_OUTPUT}"
  gated:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: ${{ needs.meta.outputs.dry != 'true' && 'release' || '' }}
    permissions:
      contents: read
    steps:
      - run: echo "ran without an environment"
