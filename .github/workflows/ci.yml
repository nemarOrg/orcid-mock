name: CI

on:
  push:
  pull_request:

# Nothing here needs more than read access; each job restates it so a job that is ever given more
# says so in its own block.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The BuildKit image the Docker steps use, pinned by digest like every other dependency here
  # (the release workflow uses the same one).
  BUILDKIT_IMAGE: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Includes tests/worker.test.ts, which bundles src/worker.ts with `wrangler deploy
      # --dry-run` and runs the bundle in workerd through Miniflare (ADR 0002's real-runtime gate).
      - run: bun run test

  # The client helpers (clients/node, clients/python) against a real container built from this
  # commit's Dockerfile, and against this commit's own server (the ORCID_MOCK_URL mode). The tests
  # use no stand-in for orcid-mock: they start the thing itself.
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The image the helpers' container tests start: the one built below, never a published one.
      ORCID_MOCK_IMAGE: orcid-mock:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build the image from the repository Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: orcid-mock:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The Node helper's tests run Playwright's runner on Node as well as on Bun, and load the
      # packed package under Node, so Node is pinned to an LTS line instead of whatever the
      # runner image ships.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # The Node helper's tests start the server from the repository (bun run src/main.ts), and its
      # type check reads the server's fixture types, so the root dependencies come first.
      - run: bun install --frozen-lockfile
      - name: Install the Node helper
        working-directory: clients/node
        run: bun install --frozen-lockfile
      - name: Lint the Node helper
        working-directory: clients/node
        run: bun run lint
      - name: Type-check the Node helper
        working-directory: clients/node
        run: bun run typecheck
      # Compiled JavaScript and declarations are what the package publishes; the package test
      # below builds, packs, installs, and loads them under Node again.
      - name: Build the Node helper
        working-directory: clients/node
        run: bun run build
      - name: Install the Playwright browser
        working-directory: clients/node
        run: bun x playwright install --with-deps chromium
      - name: Test the Node helper
        working-directory: clients/node
        run: bun run test

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - name: Install the Python helper
        working-directory: clients/python
        run: uv sync --locked
      - name: Lint the Python helper
        working-directory: clients/python
        run: uv run ruff check
      - name: Check the Python helper's formatting
        working-directory: clients/python
        run: uv run ruff format --check
      - name: Type-check the Python helper
        working-directory: clients/python
        run: uv run ty check
      - name: Test the Python helper
        working-directory: clients/python
        run: uv run pytest --cov
      # The lowest Python the package supports ran above; the classifiers list this one too.
      - name: Test the Python helper on Python 3.13
        working-directory: clients/python
        run: uv run --locked --python 3.13 --isolated pytest
      - name: Container logs
        if: failure()
        run: |
          docker ps --all
          for container in $(docker ps --all --quiet); do
            docker logs "${container}" 2>&1 | tail -n 50 || true
          done

  # The slower packaging checks (every platform's binary, a multi-arch image build) run only when
  # a file that can change them changed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A new branch has no "before", and a force push can leave it out of the history:
          # when in doubt, run the packaging checks.
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no usable base commit; running the packaging checks"
            echo "packaging=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          changed="$(git diff --name-only "${BASE}" "${HEAD}")"
          echo "${changed}"
          if grep -Eq '^(scripts/|Dockerfile$|\.dockerignore$|docker-compose\.yml$|package\.json$|bun\.lock$|src/main\.ts$|action\.yml$|\.github/workflows/)' <<< "${changed}"; then
            echo "packaging=true" >> "${GITHUB_OUTPUT}"
          else
            echo "packaging=false" >> "${GITHUB_OUTPUT}"
          fi

  binaries:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Compiling needs the runtime dependencies only.
      - run: bun install --frozen-lockfile --production
      - id: version
        run: echo "version=$(bun -e 'console.log(require("./package.json").version)')" >> "${GITHUB_OUTPUT}"
      # Every target, so a platform that stops compiling fails here rather than at release time.
      - run: bun run build:binaries
      - name: Checksums match the files
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: The linux x64 binary reports its version and mints an iD
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(./dist/orcid-mock-linux-x64 --version)"
          test "${actual}" = "${VERSION}" || { echo "version ${actual}, expected ${VERSION}"; exit 1; }
          id="$(./dist/orcid-mock-linux-x64 id -n 1)"
          echo "${id}"
          [[ "${id}" =~ ^0009-9[0-9]{3}-[0-9]{4}-[0-9]{3}[0-9X]$ ]]
      - name: The linux x64 binary serves, answers health, and stops on SIGTERM
        run: |
          set -euo pipefail
          ./dist/orcid-mock-linux-x64 serve --port 0 > ready.json 2> server.log &
          pid=$!
          for _ in $(seq 1 50); do
            [ -s ready.json ] && break
            sleep 0.2
          done
          cat ready.json
          url="$(jq -er .url ready.json)"
          curl --fail --silent "${url}/__admin/health" | jq -e '.status == "ok"'
          ./dist/orcid-mock-linux-x64 health --url "${url}"
          kill -TERM "${pid}"
          wait "${pid}"
      - name: Server log
        if: failure()
        run: cat server.log || true
      - name: Keep the binaries for the platform smoke runs
        if: needs.changes.outputs.packaging == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: |
            dist/orcid-mock-*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  smoke-binaries:
    needs: [changes, binaries]
    if: needs.changes.outputs.packaging == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-binaries.yml
    with:
      version: ${{ needs.binaries.outputs.version }}

  # Both architectures build, so a change that breaks the arm64 half fails here and not at release.
  docker-multiarch:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build the image for linux/amd64 (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: orcid-mock:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}

      - name: Run it with a mounted fixture and wait for the image's own health check
        run: |
          set -euo pipefail
          docker run --detach --name orcid-mock-ci --publish 127.0.0.1:9700:9700 \
            --env PUBLIC_BASE_URL=http://localhost:9700 \
            --env USERS_FILE=/fixtures/users.json \
            --volume "${PWD}/fixtures/users.example.json:/fixtures/users.json:ro" \
            orcid-mock:ci
          status=starting
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' orcid-mock-ci)"
            [ "${status}" = healthy ] && break
            sleep 1
          done
          echo "health status: ${status}"
          [ "${status}" = healthy ]
      - name: The admin API answers with the fixture's counts
        run: |
          set -euo pipefail
          users="$(jq '.users | length' fixtures/users.example.json)"
          clients="$(jq '.clients | length' fixtures/users.example.json)"
          curl --fail --silent http://localhost:9700/__admin/health \
            | jq -e --argjson users "${users}" --argjson clients "${clients}" \
              '.status == "ok" and .users == $users and .clients == $clients'
      - name: The image runs as a non-root user and carries its labels
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          label() { docker inspect --format "{{index .Config.Labels \"$1\"}}" orcid-mock-ci; }
          test "$(docker inspect --format '{{.Config.User}}' orcid-mock-ci)" = nonroot
          test "$(label org.opencontainers.image.source)" = https://github.com/nemarOrg/orcid-mock
          test "$(label org.opencontainers.image.licenses)" = MIT
          test "$(label org.opencontainers.image.version)" = ci
          test "$(label org.opencontainers.image.revision)" = "${SHA}"
      - name: The health check follows PORT
        run: |
          set -euo pipefail
          docker run --detach --name orcid-mock-port --env PORT=9811 orcid-mock:ci
          status=starting
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' orcid-mock-port)"
            [ "${status}" = healthy ] && break
            sleep 1
          done
          echo "health status: ${status}"
          docker rm --force orcid-mock-port
          [ "${status}" = healthy ]
      - name: It stops cleanly on SIGTERM
        run: |
          set -euo pipefail
          docker stop orcid-mock-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' orcid-mock-ci)" = 0
          docker rm orcid-mock-ci

      - name: The compose example runs the same image
        env:
          ORCID_MOCK_IMAGE: orcid-mock:ci
        run: |
          set -euo pipefail
          docker compose up --detach --wait
          curl --fail --silent http://localhost:9700/__admin/health | jq -e '.status == "ok"'
          docker compose down

      - name: Run the Action from this commit against the local image
        id: mock
        uses: ./
        with:
          image: orcid-mock
          version: ci
          users-file: fixtures/users.example.json
          port: "9700"
          # Trailing slashes are stripped before the value is exported.
          public-base-url: http://localhost:9700//
      - name: The Action exported the base URL, and the mock is reachable through it
        env:
          OUTPUT_URL: ${{ steps.mock.outputs.orcid-mock-url }}
          OUTPUT_API: ${{ steps.mock.outputs.orcid-api-base }}
          OUTPUT_PUB_API: ${{ steps.mock.outputs.orcid-pub-api-base }}
        run: |
          set -euo pipefail
          expected=http://localhost:9700
          for variable in ORCID_API_BASE ORCID_PUB_API_BASE ORCID_MOCK_URL; do
            actual="${!variable:-}"
            echo "${variable}=${actual}"
            test "${actual}" = "${expected}"
          done
          test "${OUTPUT_URL}" = "${expected}"
          test "${OUTPUT_API}" = "${expected}"
          test "${OUTPUT_PUB_API}" = "${expected}"
          curl --fail --silent "${ORCID_API_BASE}/__admin/health" | jq -e '.status == "ok"'
      - name: The Action refuses a base URL that would inject another variable
        id: injected
        continue-on-error: true
        uses: ./
        with:
          image: orcid-mock
          version: ci
          port: "9701"
          public-base-url: "http://localhost:9701\nORCID_MOCK_INJECTED=1"
      - name: It was refused, and nothing leaked into the environment
        env:
          OUTCOME: ${{ steps.injected.outcome }}
        run: |
          set -euo pipefail
          test "${OUTCOME}" = failure
          test -z "${ORCID_MOCK_INJECTED:-}"
          test -z "$(docker ps --quiet --filter publish=9701)"
      - name: The Action refuses a base URL with whitespace
        id: spaced
        continue-on-error: true
        uses: ./
        with:
          image: orcid-mock
          version: ci
          port: "9701"
          public-base-url: http://local host
      - name: That was refused too
        env:
          OUTCOME: ${{ steps.spaced.outcome }}
        run: test "${OUTCOME}" = failure

      - name: Container logs
        if: failure()
        run: |
          docker ps --all
          for container in $(docker ps --all --quiet --filter name=orcid-mock); do
            docker logs "${container}" 2>&1 || true
          done

  # The epic's definition of done on a runner: the image built from this commit, started by this
  # commit's Action, and the conformance suite driven against it with no browser. It includes a
  # brand-new sign-up (conformance/round-trip.test.ts) from creating the user to resetting it away.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The suite needs the runtime dependencies only (jose, for the ID token check).
      - run: bun install --frozen-lockfile --production
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build the image for linux/amd64 (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: orcid-mock:e2e
          build-args: |
            VERSION=e2e
            REVISION=${{ github.sha }}
      - name: Start the mock with this repository's Action
        uses: ./
        with:
          # The Action runs "<image>:<version>", which is the tag built above.
          image: orcid-mock
          version: e2e
      - name: Run the conformance suite against the mock
        env:
          CONFORMANCE_TARGET: mock
          # The starter fixture's public client; its secret is published in the README.
          ORCID_CLIENT_ID: APP-ORCIDMOCK000001
          ORCID_CLIENT_SECRET: orcid-mock-secret
        run: |
          set -euo pipefail
          # ORCID_API_BASE and ORCID_PUB_API_BASE were exported by the Action.
          echo "ORCID_API_BASE=${ORCID_API_BASE}"
          echo "ORCID_PUB_API_BASE=${ORCID_PUB_API_BASE}"
          # The starter users' iDs are minted, so ask the mock for a user with a public name.
          ORCID_PUBLIC_ID="$(curl --fail --silent "${ORCID_API_BASE}/__admin/users" \
            | jq -er '[.[] | select(.name.visibility == "public")][0].orcid')"
          export ORCID_PUBLIC_ID
          echo "ORCID_PUBLIC_ID=${ORCID_PUBLIC_ID}"
          bun run conformance
      - name: Container logs
        if: failure()
        run: |
          docker ps --all
          for container in $(docker ps --all --quiet --filter name=orcid-mock); do
            docker logs "${container}" 2>&1 || true
          done
