name: Release

# A real release runs only when the owner pushes a tag vX.Y.Z whose number equals package.json's
# version, whose commit is on main, and whose major equals the Action's default image tag. Nothing
# is pushed, published, released, or tagged from anywhere else.
#
# Order, so that a failure leaves nothing public and a re-run converges:
#   verify            tag, version, the helpers' versions, and Action default agree; lint, typecheck, tests
#   preflight         the NPM_TOKEN secret exists and npm accepts it (real runs only)
#   binaries, smoke   build every binary once, run it on each kind of runner (gating)
#   pypi-dist         build the Python helper's wheel and sdist (gating; holds no credentials)
#   image             build and smoke-test the image BEFORE pushing; then push only the exact tag,
#                     smoke-test what was pushed, and attest it. The first public effect.
#   npm               publish the server and the Node helper, each unless its version is already there
#   pypi              publish the Python helper through PyPI trusted publishing, unless already there
#   release           create or update the GitHub Release, upload the binaries again with --clobber
#   promote           move latest, MAJOR, MAJOR.MINOR and the Action's v<major> tag, but only
#                     forward: never to a version that is not the highest in its scope
#
# To rehearse (every build and check, none of the side effects), run this workflow by hand with
# "dry-run" on, from any branch. A dry run does not use the "release" environment, so it cannot
# check the npm token; it says so.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and check everything, but do not push the image, publish to npm, create the release, or move a tag
        type: boolean
        default: true

permissions:
  contents: read

# One release per tag at a time, and a newer tag does not replace a queued older one. Never cancel
# a release that is half done.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nemarorg/orcid-mock
  # Pinned by digest, like the base images in the Dockerfile.
  BUILDKIT_IMAGE: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
  BINFMT_IMAGE: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      major: ${{ steps.meta.outputs.major }}
      minor: ${{ steps.meta.outputs.minor }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dry-run: ${{ steps.meta.outputs.dry-run }}
      latest: ${{ steps.meta.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The main-branch check and the tag comparison below need history and every tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - id: meta
        env:
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error title=Release::$1"
            exit 1
          }
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if ! [[ "${version}" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            fail "package.json version '${version}' is not a semantic version (X.Y.Z or X.Y.Z-prerelease)."
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            dry_run="${INPUT_DRY_RUN}"
          else
            dry_run=false
          fi
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              fail "Tag ${GITHUB_REF_NAME} does not equal v${version} from package.json. Bump the version, commit it, and tag that commit."
            fi
          elif [ "${dry_run}" != true ]; then
            fail "A real release runs from a tag. Push v${version}, or keep dry-run on to rehearse from a branch."
          fi
          if [ "${dry_run}" != true ] && ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            fail "${GITHUB_REF_NAME} is not on main. Merge to main first, then tag the merge commit."
          fi

          prerelease=false
          [[ "${version}" == *-* ]] && prerelease=true

          # The Action's default image tag is its own major: a release of the 1.x line must not
          # leave `uses: nemarOrg/orcid-mock@v1` pointing at another line, and a release of 2.0.0
          # must not go out while the Action still defaults to 1. (A prerelease moves no tags.)
          action_default="$(bun -e 'console.log(Bun.YAML.parse(await Bun.file("action.yml").text()).inputs.version.default)')"
          if [ "${prerelease}" != true ] && [ "${action_default}" != "${major}" ]; then
            fail "action.yml defaults version to '${action_default}' but package.json is major ${major} (${version}). Make them agree before releasing: the Action's default image tag is its own major."
          fi

          # The client helpers are released in lockstep with the server (ADR 0008): the Node
          # helper's version and the Python helper's version are the tag's, character for character,
          # since a helper's default image tag is its own version.
          node_helper="$(bun -e 'console.log(require("./clients/node/package.json").version)')"
          python_helper="$(bun -e 'console.log(Bun.TOML.parse(await Bun.file("clients/python/pyproject.toml").text()).project.version)')"
          if [ "${node_helper}" != "${version}" ]; then
            fail "clients/node/package.json is version '${node_helper}' but package.json is '${version}'. The helpers are released in lockstep: bump them together."
          fi
          if [ "${python_helper}" != "${version}" ]; then
            fail "clients/python/pyproject.toml is version '${python_helper}' but package.json is '${version}'. The helpers are released in lockstep: bump them together."
          fi
          # PEP 440 has no spelling for an arbitrary semantic-version prerelease: only these three
          # forms survive the trip (1.2.3-rc.1 is 1.2.3rc1 on PyPI, and the helper maps it back).
          if [ "${prerelease}" = true ] && ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            fail "Prerelease '${version}' cannot be released: the Python helper needs a PEP 440 form, so use -alpha.N, -beta.N, or -rc.N."
          fi

          # Whether this release is the highest stable version, which decides the "latest" mark on
          # the GitHub Release. The promote job asks again, with the tags as they are by then.
          moves="$(git tag --list | bun scripts/floating-tags.ts --version "${version}")"
          latest="$(sed -n 's/^latest=//p' <<< "${moves}")"
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "major=${major}"
            echo "minor=${minor}"
            echo "prerelease=${prerelease}"
            echo "dry-run=${dry_run}"
            echo "latest=${latest}"
          } >> "${GITHUB_OUTPUT}"
          echo "Releasing ${version} (prerelease: ${prerelease}, latest: ${latest}, dry run: ${dry_run})"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # The helpers' own gates (lint, types, tests against a container) run in CI's clients job on
      # every push; here only that the Node helper packs, before anything is public.
      - name: The Node helper packs
        working-directory: clients/node
        run: bun pm pack --dry-run

  # Before anything is public: is there a token, and does npm accept it? The secret lives in the
  # "release" environment (restricted to v*.*.* tags, with a required reviewer), which a dry run
  # does not use, so a dry run cannot check it.
  preflight:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.verify.outputs.dry-run != 'true' && 'release' || '' }}
    permissions:
      contents: read
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Check the npm token
        env:
          DRY_RUN: ${{ needs.verify.outputs.dry-run }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # bun reads this variable.
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = true ]; then
            echo "::notice title=Dry run::The NPM_TOKEN secret lives in the release environment, which a dry run does not use, so its presence and validity are NOT checked. Everything else is."
            exit 0
          fi
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error title=npm::The NPM_TOKEN secret is not set in the 'release' environment, so the package cannot be published. Create an npm granular access token that can publish to the @nemarorg scope and add it as an environment secret named NPM_TOKEN on the release environment (see 'Releasing' in the README)."
            exit 1
          fi
          # `bun pm whoami` asks the registry who the token belongs to: a revoked, expired, or
          # mistyped token fails here, before the image is pushed.
          if ! bun pm whoami; then
            echo "::error title=npm::npm did not accept the NPM_TOKEN secret (expired, revoked, or wrong). Replace it, then re-run this workflow."
            exit 1
          fi

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      # Compiling needs the runtime dependencies only.
      - run: bun install --frozen-lockfile --production
      - run: bun run build:binaries
      - name: Checksums match the files
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      # What the platform runs test is exactly what the release job uploads.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: |
            dist/orcid-mock-*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  smoke-binaries:
    needs: [verify, binaries]
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-binaries.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  # The Python helper's wheel and sdist, built before anything is public and without credentials:
  # the job that holds the PyPI identity only downloads these files, so no build backend runs next
  # to it.
  pypi-dist:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false
      - name: Build the wheel and the source distribution
        working-directory: clients/python
        run: uv build
      - name: The files carry the version being released
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        working-directory: clients/python
        run: |
          set -euo pipefail
          ls -l dist
          # PEP 440 normalizes 1.2.3-rc.1 to 1.2.3rc1 in the file names (the verify job allows
          # only the -alpha.N, -beta.N, and -rc.N forms).
          normalized="${VERSION}"
          if [[ "${VERSION}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta|rc)\.([0-9]+)$ ]]; then
            case "${BASH_REMATCH[2]}" in
              alpha) word=a ;;
              beta) word=b ;;
              rc) word=rc ;;
            esac
            normalized="${BASH_REMATCH[1]}${word}${BASH_REMATCH[3]}"
          fi
          test -f "dist/orcid_mock_testing-${normalized}-py3-none-any.whl"
          test -f "dist/orcid_mock_testing-${normalized}.tar.gz"
          test "$(find dist -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: clients/python/dist/*
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [verify, preflight, smoke-binaries, pypi-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # QEMU is here only so that the arm64 image can run once (--version) before it is pushed.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Log in to ghcr.io
        if: needs.verify.outputs.dry-run != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An existing tag for this version is fine only if this very commit built it (a re-run);
      # a different commit means the version was already released, and a tag must not be reused.
      - name: Check whether the exact tag already exists
        id: guard
        if: needs.verify.outputs.dry-run != 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:${VERSION}"
          # A package that has never been pushed answers a registry client with 403 or 404 in
          # several wordings (tried locally against this very name); those mean "absent", and if
          # the registry really refuses us, the push below fails loudly. Any other failure (a
          # network error, say) stops the release instead of guessing.
          if out="$(docker buildx imagetools inspect "${ref}" 2>&1)"; then
            # The runner's own platform: every platform of one build carries the same label.
            docker pull --quiet "${ref}" > /dev/null
            revision="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${ref}")"
            if [ "${revision}" != "${GITHUB_SHA}" ]; then
              echo "::error title=Release::${ref} already exists and was built from commit '${revision}', not ${GITHUB_SHA}. A released tag is never overwritten; bump the version."
              exit 1
            fi
            echo "${ref} already exists, built from this commit: this is a re-run, so it is not pushed again."
            echo "published=true" >> "${GITHUB_OUTPUT}"
          elif grep -Eqi 'not found|manifest unknown|name unknown|denied|unauthorized|forbidden|failed to authorize|404' <<< "${out}"; then
            echo "${ref} does not exist yet."
            echo "published=false" >> "${GITHUB_OUTPUT}"
          else
            echo "${out}"
            echo "::error title=Release::Could not tell whether ${ref} exists."
            exit 1
          fi

      - name: Build the amd64 image and load it for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: orcid-mock:release
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Smoke test the amd64 image before it is pushed
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(docker run --rm orcid-mock:release --version)"
          test "${actual}" = "${VERSION}" || { echo "image reports ${actual}, expected ${VERSION}"; exit 1; }
          docker run --detach --name smoke --publish 127.0.0.1:9700:9700 \
            --env PUBLIC_BASE_URL=http://localhost:9700 orcid-mock:release
          SECONDS=0
          until [ "$(docker inspect --format '{{.State.Health.Status}}' smoke)" = healthy ]; do
            if [ "${SECONDS}" -ge 60 ]; then
              docker logs smoke
              echo "::error title=Release::the image did not become healthy within 60 seconds"
              exit 1
            fi
            sleep 1
          done
          docker logs smoke 2>&1 | grep -q '"event":"listening"'
          curl --fail --silent http://localhost:9700/__admin/health | jq -e '.status == "ok"'
          docker rm --force smoke
      - name: Build the arm64 image and run it once under emulation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          tags: orcid-mock:release-arm64
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Smoke test the arm64 image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(docker run --rm --platform linux/arm64 orcid-mock:release-arm64 --version)"
          test "${actual}" = "${VERSION}" || { echo "arm64 image reports ${actual}, expected ${VERSION}"; exit 1; }

      # Only the exact-version tag is pushed here. latest, MAJOR, and MAJOR.MINOR move in the
      # promote job, last, and only forward.
      - name: Build the multi-arch image, and push the exact tag unless this is a dry run
        id: push
        if: steps.guard.outputs.published != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.verify.outputs.dry-run != 'true' }}
          # The attestation below replaces BuildKit's, which would add unknown/unknown entries to
          # the image index.
          provenance: false
          tags: ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Find the digest of the exact tag
        id: digest
        if: needs.verify.outputs.dry-run != 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Smoke test the pushed image
        if: needs.verify.outputs.dry-run != 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          actual="$(docker run --rm "${IMAGE}@${DIGEST}" --version)"
          test "${actual}" = "${VERSION}" || { echo "pushed image reports ${actual}, expected ${VERSION}"; exit 1; }
      - name: Attest the image's build provenance
        if: needs.verify.outputs.dry-run != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  npm:
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.verify.outputs.dry-run != 'true' && 'release' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      # No install: bun publish packs the files the package lists, and runs nothing from it.
      - name: Publish the server and the Node helper to npm, unless each version is already there
        env:
          # bun reads this variable. The token is checked in the preflight job.
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          DRY_RUN: ${{ needs.verify.outputs.dry-run }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--access public)
          # A prerelease must not become the version that gets the default dist-tag.
          if [ "${PRERELEASE}" = true ]; then flags+=(--tag next); fi

          # Each package is published, or skipped, on its own, so a re-run after a failure between
          # the two finishes the job. The Node helper's default image tag is its own version, and
          # the image job has already pushed that tag.
          publish() {
            local dir="$1" name="$2"
            if [ "${DRY_RUN}" = true ]; then
              (cd "${dir}" && bun publish "${flags[@]}" --dry-run)
              return
            fi
            # npm never lets a version be published twice, so a re-run after a later job failed
            # must not try.
            if bun pm view "${name}@${VERSION}" version > /dev/null 2>&1; then
              echo "::notice title=npm::${name}@${VERSION} is already published; nothing to do."
              return
            fi
            (cd "${dir}" && bun publish "${flags[@]}")
          }
          publish . "@nemarorg/orcid-mock"
          publish clients/node "@nemarorg/orcid-mock-testing"

  # The Python helper, through PyPI trusted publishing: no stored token, the job's OpenID Connect
  # identity is the credential. The PyPI project must name this repository, this workflow, and the
  # "pypi" environment as a trusted publisher (see "Releasing" in the README). The job only uploads
  # the files pypi-dist built.
  pypi:
    needs: [verify, image, pypi-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.verify.outputs.dry-run != 'true' && 'pypi' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI, skipping files that are already there
        env:
          DRY_RUN: ${{ needs.verify.outputs.dry-run }}
        run: |
          set -euo pipefail
          ls -l dist
          if [ "${DRY_RUN}" = true ]; then
            # A dry run uses no environment, so it cannot be a trusted publisher: it only checks
            # the files.
            echo "::notice title=Dry run::A dry run does not use the pypi environment, so whether PyPI trusts this workflow is NOT checked. The files are."
            uv publish --dry-run --trusted-publishing never dist/*
            exit 0
          fi
          # --check-url skips a file the index already has, so a re-run after a later job failed
          # finishes instead of failing on a second upload of the same version.
          uv publish --trusted-publishing always \
            --check-url https://pypi.org/simple/orcid-mock-testing/ dist/*

  release:
    needs: [verify, image, npm, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist
      - name: Attest the binaries' build provenance
        if: needs.verify.outputs.dry-run != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/orcid-mock-*
      - name: Create the GitHub Release if it does not exist, then upload the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          LATEST: ${{ needs.verify.outputs.latest }}
          DRY_RUN: ${{ needs.verify.outputs.dry-run }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "${TAG}")
          if [ "${PRERELEASE}" = true ]; then
            flags+=(--prerelease --latest=false)
          else
            # Only the highest stable version is the latest release.
            flags+=(--latest="${LATEST}")
          fi
          if [ "${DRY_RUN}" = true ]; then
            echo "Dry run: would create ${TAG} (gh release create ${flags[*]}) unless it exists, and upload:"
            ls -l dist/orcid-mock-* dist/SHA256SUMS
            exit 0
          fi
          # Create-or-update, so a re-run after a partial failure finishes the job: the release
          # may exist without its files, or with only some of them.
          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            gh release create "${TAG}" "${flags[@]}"
          fi
          gh release upload "${TAG}" dist/orcid-mock-* dist/SHA256SUMS --clobber

  # Last, and only forward. The Action is used as nemarOrg/orcid-mock@v<major>.
  promote:
    needs: [verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The last step pushes the v<major> tag with the job's token.
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Log in to ghcr.io
        if: needs.verify.outputs.dry-run != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move the floating tags that this release is the highest for
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          MAJOR: ${{ needs.verify.outputs.major }}
          MINOR: ${{ needs.verify.outputs.minor }}
          DRY_RUN: ${{ needs.verify.outputs.dry-run }}
        run: |
          set -euo pipefail
          # Tags as they are now, not as they were when this run started.
          git fetch --tags --force --quiet
          moves="$(git tag --list | bun scripts/floating-tags.ts --version "${VERSION}")"
          echo "${moves}"
          move() { grep -qx "$1=true" <<< "${moves}"; }

          image_tags=()
          if move latest; then image_tags+=(--tag "${IMAGE}:latest"); fi
          if move major; then image_tags+=(--tag "${IMAGE}:${MAJOR}"); fi
          if move minor; then image_tags+=(--tag "${IMAGE}:${MAJOR}.${MINOR}"); fi

          if [ "${DRY_RUN}" = true ]; then
            echo "Dry run: would point ${image_tags[*]:-nothing} at ${IMAGE}:${VERSION}."
            if move major; then echo "Dry run: would move v${MAJOR} to ${GITHUB_SHA}."; fi
            exit 0
          fi
          if [ "${#image_tags[@]}" -gt 0 ]; then
            # From the exact tag, so the floating tags are the same image, digest and all.
            docker buildx imagetools create "${image_tags[@]}" "${IMAGE}:${VERSION}"
          fi
          if move major; then
            git tag --force "v${MAJOR}" "${GITHUB_SHA}"
            git push --force origin "refs/tags/v${MAJOR}"
          fi
