# Version updates for what Dependabot can see: GitHub Actions (pinned by full commit hash), Bun
# packages (exact versions in package.json and bun.lock) for the server and for the Node helper in
# clients/node, and Python packages for the Python helper in clients/python (uv.lock).
#
# The `docker` entry reads the Dockerfile's two `FROM image:tag@digest` lines and proposes new tags
# and digests for both base images. The image digests and tool versions written into the workflows,
# and the Bun version (which moves together with @types/bun and the oven/bun tag) are bumped by hand:
# RELEASING.md lists each pin and how.
#
# Every update waits seven days after its release before Dependabot proposes it, so a compromised
# release has a week to be caught first. The cooldown applies to version updates only: security
# updates are not delayed. bunfig.toml holds the same seven-day rule for `bun install`, and
# clients/python/pyproject.toml the same for uv (`exclude-newer`).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    ignore:
      # wrangler 4.117 and later pin Miniflare 5, which is still an alpha with a different options
      # API (see tests/worker.test.ts). Lift both when Miniflare 5 is stable and the test moves.
      - dependency-name: wrangler
        versions: [">=4.117.0"]
      - dependency-name: miniflare
        versions: [">=5.0.0"]

  - package-ecosystem: bun
    directory: /clients/node
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  - package-ecosystem: uv
    directory: /clients/python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
