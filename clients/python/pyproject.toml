[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orcid-mock-testing"
# Released in lockstep with the server (and the Node helper): the release workflow refuses a tag
# that differs from this string. A prerelease is written in the tag's own form, for example
# 1.2.3-rc.1, which PEP 440 normalizes to 1.2.3rc1.
version = "0.0.0"
description = "Test helpers for orcid-mock, an ephemeral mock of the ORCID service: an admin-API client, a Testcontainers module, and a pytest plugin"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["orcid", "mock", "testing", "testcontainers", "pytest", "oauth2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28",
  "testcontainers>=4.15",
]

[project.urls]
Homepage = "https://github.com/nemarOrg/orcid-mock#test-helpers"
Repository = "https://github.com/nemarOrg/orcid-mock"
Issues = "https://github.com/nemarOrg/orcid-mock/issues"

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-cov>=7",
  "ruff",
  "ty",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orcid_mock"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "LICENSE", "pyproject.toml"]

[tool.uv]
# Mirrors bunfig.toml's minimumReleaseAge: nothing published in the last seven days.
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "PTH", "TRY", "S", "ANN"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["orcid_mock"]
branch = true

[tool.coverage.report]
show_missing = true
