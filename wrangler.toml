# A private orcid-mock on your own Cloudflare account, for a portability check and for trying the
# Worker build. This is the smoke-test entry, not the hosted mode: it serves the bundled starter
# users from memory, one store per isolate, with no persistence (see the header of src/worker.ts).
#
# WARNING: a deployed Worker is reachable from the internet and exposes the unauthenticated admin
# API (every fixture user and client secret, and a reset or rewrite of all state). Deploy it only
# where that is acceptable, and put Cloudflare Access or another gate in front of it.
# `workers_dev = false` below keeps it off the public *.workers.dev address until you route it
# deliberately.
#
#   bun x wrangler deploy --dry-run --outdir dist/worker   bundle it without deploying
#   bun x wrangler dev                                     run it locally in workerd
#
# Set PUBLIC_BASE_URL to the URL callers reach the Worker at, either below or with
# `wrangler deploy --var PUBLIC_BASE_URL:https://...`; without it every request answers 500.
name = "orcid-mock"
main = "src/worker.ts"
# Must not be later than the date of the workerd that runs it (the test uses this same value).
compatibility_date = "2026-07-01"
# nodejs_compat is off on purpose: the portable layer uses Web APIs only (ADR 0002).

workers_dev = false

# [vars]
# PUBLIC_BASE_URL = "https://orcid-mock.example.workers.dev"
